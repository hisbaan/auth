definitions:
  admin.GetUserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      email_verified:
        type: boolean
      id:
        type: string
      roles:
        items:
          type: string
        type: array
      updated_at:
        type: string
      username:
        type: string
    type: object
  admin.ListUsersResponse:
    properties:
      next_cursor:
        type: string
      users:
        items:
          $ref: '#/definitions/admin.UserWithMetadata'
        type: array
    type: object
  admin.UpdateUserRoleParams:
    properties:
      role:
        type: string
      user_id:
        type: string
    type: object
  admin.UserWithMetadata:
    properties:
      created_at:
        type: string
      email:
        type: string
      email_verified:
        type: boolean
      id:
        type: string
      roles:
        items:
          type: string
        type: array
      updated_at:
        type: string
      username:
        type: string
    type: object
  auth.CreateUserParams:
    properties:
      email:
        type: string
      password:
        type: string
      username:
        type: string
    type: object
  auth.ForgotPasswordParams:
    properties:
      email:
        type: string
    type: object
  auth.LoginParams:
    properties:
      email:
        type: string
      password:
        type: string
      totp:
        type: integer
    type: object
  auth.LoginResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
      token_type:
        type: string
    type: object
  auth.PasswordResetParams:
    properties:
      new_password:
        type: string
      token:
        type: string
    type: object
  auth.RefreshParams:
    properties:
      refresh_token:
        type: string
    type: object
  auth.RefreshResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
      token_type:
        type: string
    type: object
  auth.VerifyEmailParams:
    properties:
      token:
        type: string
    type: object
  users.GetUserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      email_verified:
        type: boolean
      id:
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
  users.UpdatePasswordParams:
    properties:
      current_password:
        type: string
      new_password:
        type: string
    type: object
  users.UpdateUserParams:
    properties:
      email:
        type: string
      username:
        type: string
    type: object
info:
  contact: {}
  description: api for auth.hisbaan.com
  title: auth
  version: 0.0.1
paths:
  /admin/users:
    get:
      description: Returns a paginated list of users (admin only)
      parameters:
      - description: Pagination cursor
        in: query
        name: cursor
        type: string
      - description: Maximum number of results (max 100)
        in: query
        name: limit
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.ListUsersResponse'
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
      security:
      - BearerAuth: []
      summary: List users
      tags:
      - admin
  /admin/users/{id}:
    get:
      description: Returns a user by their ID (admin only)
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.GetUserResponse'
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not Found
      security:
      - BearerAuth: []
      summary: Get user by ID
      tags:
      - admin
  /admin/users/roles:
    delete:
      consumes:
      - application/json
      description: Removes a role from a user (admin only)
      parameters:
      - description: User role removal
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/admin.UpdateUserRoleParams'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
      security:
      - BearerAuth: []
      summary: Remove user role
      tags:
      - admin
    post:
      consumes:
      - application/json
      description: Assigns a role to a user (admin only)
      parameters:
      - description: User role assignment
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/admin.UpdateUserRoleParams'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
      security:
      - BearerAuth: []
      summary: Add user role
      tags:
      - admin
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Sends a password reset email to the user
      parameters:
      - description: Email address
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.ForgotPasswordParams'
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Request password reset
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates user and returns access and refresh tokens
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LoginParams'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.LoginResponse'
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "500":
          description: Internal Server Error
      summary: Login user
      tags:
      - auth
  /auth/password-reset:
    post:
      consumes:
      - application/json
      description: Resets user password using a valid reset token
      parameters:
      - description: Password reset details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.PasswordResetParams'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Reset password
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Issues a new access token using a valid refresh token
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.RefreshParams'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.RefreshResponse'
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
      summary: Refresh access token
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Creates a new user account and sends verification email
      parameters:
      - description: User registration details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.CreateUserParams'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
        "409":
          description: Conflict
        "500":
          description: Internal Server Error
      summary: Register a new user
      tags:
      - auth
  /auth/verify-email:
    post:
      consumes:
      - application/json
      description: Verifies user email using a valid verification token
      parameters:
      - description: Email verification token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.VerifyEmailParams'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Verify email
      tags:
      - auth
  /users/me:
    delete:
      description: Deletes the authenticated user's account
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
      security:
      - BearerAuth: []
      summary: Delete current user
      tags:
      - users
    get:
      description: Returns the authenticated user's profile
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/users.GetUserResponse'
        "401":
          description: Unauthorized
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - users
    put:
      consumes:
      - application/json
      description: Updates the authenticated user's profile
      parameters:
      - description: User update details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/users.UpdateUserParams'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "409":
          description: Conflict
      security:
      - BearerAuth: []
      summary: Update current user
      tags:
      - users
  /users/me/password:
    post:
      consumes:
      - application/json
      description: Changes the authenticated user's password
      parameters:
      - description: Password change details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/users.UpdatePasswordParams'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
      security:
      - BearerAuth: []
      summary: Change password
      tags:
      - users
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
